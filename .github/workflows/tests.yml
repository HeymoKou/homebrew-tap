# Based on the `brew tap-new` template (Homebrew/actions 2026.11.02.1).
# Builds bottles for formulae changed in a pull request; publish.yml then
# uploads them to a GitHub Release and commits the `bottle do` block.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        # macos-15, not macos-26 (template default) and not macos-14:
        # cbar needs Swift tools 6.0, which the macos-14 image lacks, and a
        # bottle is used on the macOS it was built on and anything newer —
        # so the oldest buildable OS covers the most users. Older or Intel
        # Macs fall back to building from source. No Linux: cbar is macOS-only.
        os: [ macos-15 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

      # A version bump pushed straight to main (no PR) leaves a `bottle do`
      # block that points at the previous version's bottle. Fail loudly here
      # so it gets noticed, instead of users hitting a missing bottle.
      - name: Bottle matches the formula on main
        if: github.event_name == 'push'
        run: |
          formula="$(brew --repository heymokou/tap)/Formula/cbar.rb"
          if grep -q '^  bottle do' "$formula"; then
            brew fetch --force-bottle --formula heymokou/tap/cbar
          else
            echo "::warning::Formula/cbar.rb has no bottle block — installs build from source. Open a pull request to build a bottle."
          fi
